apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: arvo-benchmark-
  namespace: argo
spec:
  entrypoint: benchmark-pipeline
  serviceAccountName: arvo-workflow-sa

  # Resource quota for parallel execution
  parallelism: 500

  # Propagate labels to all pods (for GCP resource tracking)
  podMetadata:
    labels:
      owner: "{{workflow.labels.owner}}"
      experiment: "{{workflow.parameters.experiment-id}}"
    annotations:
      owner: "{{workflow.labels.owner}}"

  arguments:
    parameters:
      - name: experiment-id
        value: "default"
      - name: bucket
        value: ""
      - name: registry
        value: ""
      - name: build-version
        value: "latest"
      - name: fuzzing-duration
        value: "300"
      - name: run-gt
        value: "true"
      # Dependency build flags
      - name: build-casr
        value: "false"
      - name: build-dd
        value: "false"
      # withParam: JSON array of case ID strings, e.g. ["1236","16614",...]
      - name: cases-json
        value: "[]"
      # Pre-computed Docker v2 API URL prefix for check-image
      # e.g. "https://us-central1-docker.pkg.dev/v2/project/repo"
      - name: registry-api-prefix
        value: ""
      # Spot instance flags
      - name: patch-use-spot
        value: "true"
      - name: fuzz-use-spot
        value: "true"

  templates:
    # Main entry point - withParam over cases, agent tasks expanded in case-pipeline template
    # The case-pipeline template is dynamically generated by the CLI based on agent specs
    - name: benchmark-pipeline
      dag:
        failFast: false
        tasks:
          # Build CASR (if needed)
          - name: build-casr
            when: '"{{workflow.parameters.build-casr}}" == "true"'
            templateRef:
              name: arvo-deps-build
              template: build-casr
            arguments:
              parameters:
                - name: bucket
                  value: "{{workflow.parameters.bucket}}"
                - name: force-rebuild
                  value: "true"

          # Build DD (if needed)
          - name: build-dd
            when: '"{{workflow.parameters.build-dd}}" == "true"'
            templateRef:
              name: arvo-deps-build
              template: build-dd
            arguments:
              parameters:
                - name: bucket
                  value: "{{workflow.parameters.bucket}}"
                - name: force-rebuild
                  value: "true"

          # Process each case via withParam - expands to one case-pipeline per case
          # The case-pipeline template (injected by CLI) handles builds, patches, fuzz, and GT per case
          - name: process-cases
            dependencies: [build-casr, build-dd]
            withParam: "{{workflow.parameters.cases-json}}"
            template: case-pipeline
            arguments:
              parameters:
                - name: case-id
                  value: "{{item}}"

    # Lightweight container check for GCS completion markers
    # Uses busybox wget to check if _SUCCESS marker exists via GCS JSON API
    # Outputs status parameter: "done" (file exists, skip task) or "needed" (file missing, run task)
    # Always exits 0 so the node is Succeeded; downstream tasks check the output parameter.
    # continueOn + valueFrom.default handle rare edge cases (pod timeout/OOM).
    # NOTE: Replaced HTTP template to avoid WorkflowTaskSet etcd size limit (1.5MB)
    # at scale. Container templates use individual pods instead of a shared TaskSet.
    - name: check-completion
      inputs:
        parameters:
          - name: bucket
          - name: path # URL-encoded path to _SUCCESS marker
      activeDeadlineSeconds: 60
      tolerations:
        - key: "workload"
          operator: "Exists"
          effect: "NoSchedule"
      container:
        image: busybox:1.37
        imagePullPolicy: IfNotPresent
        command: [sh, -c]
        args:
          - |
            for i in 1 2 3 4 5; do
              wget -q --spider --header "Authorization: $TOKEN" \
                "https://storage.googleapis.com/storage/v1/b/{{inputs.parameters.bucket}}/o/{{inputs.parameters.path}}" \
                && { echo -n done > /tmp/status; exit 0; }
              sleep 2
            done
            echo -n needed > /tmp/status
            exit 0
        env:
          - name: TOKEN
            valueFrom:
              secretKeyRef:
                name: gcs-auth-token
                key: token
        resources:
          requests:
            cpu: 500m
            memory: 32Mi
          limits:
            cpu: "1"
            memory: 64Mi
      outputs:
        parameters:
          - name: status
            valueFrom:
              path: /tmp/status
              default: "needed"

    # Lightweight container check for Artifact Registry image existence
    # Uses busybox wget to check if a container image:tag exists via Docker v2 manifests API
    # Outputs status parameter: "done" (image exists, skip build) or "needed" (missing, run build)
    # Always exits 0 so the node is Succeeded; downstream tasks check the output parameter.
    # continueOn + valueFrom.default handle rare edge cases (pod timeout/OOM).
    # NOTE: Replaced HTTP template to avoid WorkflowTaskSet etcd size limit (1.5MB)
    - name: check-image
      inputs:
        parameters:
          - name: url # Full Docker v2 manifests URL
      activeDeadlineSeconds: 60
      tolerations:
        - key: "workload"
          operator: "Exists"
          effect: "NoSchedule"
      container:
        image: busybox:1.37
        imagePullPolicy: IfNotPresent
        command: [sh, -c]
        args:
          - |
            for i in 1 2 3 4 5; do
              wget -q -O /dev/null --header "Authorization: $TOKEN" \
                --header "Accept: application/vnd.docker.distribution.manifest.v2+json" \
                "{{inputs.parameters.url}}" \
                && { echo -n done > /tmp/status; exit 0; }
              sleep 2
            done
            echo -n needed > /tmp/status
            exit 0
        env:
          - name: TOKEN
            valueFrom:
              secretKeyRef:
                name: gcs-auth-token
                key: token
        resources:
          requests:
            cpu: 500m
            memory: 32Mi
          limits:
            cpu: "1"
            memory: 64Mi
      outputs:
        parameters:
          - name: status
            valueFrom:
              path: /tmp/status
              default: "needed"
