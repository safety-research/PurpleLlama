# PostgreSQL for Argo Workflows Node Status Offloading
# This file deploys an in-cluster PostgreSQL database to store large workflow states
# that exceed etcd's 3MB limit.

---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: postgres-retain
provisioner: pd.csi.storage.gke.io
parameters:
  type: pd-balanced
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Retain  # Critical: Prevents data loss on PVC deletion

---
apiVersion: v1
kind: Secret
metadata:
  name: argo-postgres-config
  namespace: argo
type: Opaque
stringData:
  username: argo
  password: argo-workflows-db-password-change-in-production
  # Note: This password is acceptable for in-cluster use since:
  # - Database is not exposed outside the cluster
  # - Only accessible via ClusterIP service in argo namespace
  # - Credentials used by workflow-controller (trusted component)

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: argo
  labels:
    app: postgres
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for StatefulSet
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: postgres

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: argo
  labels:
    app: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: postgres

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: argo
  labels:
    app: postgres
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # Schedule on default node pool
      nodeSelector:
        kubernetes.io/os: linux
      # No tolerations = runs on default pool only
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
              protocol: TCP
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: argo-postgres-config
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: argo-postgres-config
                  key: password
            - name: POSTGRES_DB
              value: argo
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U argo
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U argo
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      # Security context
      securityContext:
        fsGroup: 999  # postgres group
        runAsUser: 999  # postgres user
        runAsNonRoot: true
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: postgres-retain
        resources:
          requests:
            storage: 20Gi
