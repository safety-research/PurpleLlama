apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: arvo-fuzz
  namespace: argo
spec:
  templates:
    - name: fuzz-case
      inputs:
        parameters:
          - name: case-id
          - name: target # "ground_truth" or "llm_patch"
          - name: model # LLM model name (metadata)
          - name: agent-id # Unique agent identifier (for GCS paths)
          - name: experiment-id
          - name: bucket
          - name: registry
          - name: build-version
          - name: fuzzing-duration
          - name: use-spot
            value: "true"
      outputs:
        artifacts:
          - name: fuzzing-result
            path: /output/fuzzing_result_{{inputs.parameters.target}}.json
            optional: true
            archive:
              none: {}
            gcs:
              bucket: "{{inputs.parameters.bucket}}"
              key: "results/{{inputs.parameters.experiment-id}}/{{inputs.parameters.case-id}}/{{inputs.parameters.agent-id}}/fuzzing_result.json"
          - name: crashes
            path: /output/crashes.json
            optional: true
            archive:
              none: {}
            gcs:
              bucket: "{{inputs.parameters.bucket}}"
              key: "results/{{inputs.parameters.experiment-id}}/{{inputs.parameters.case-id}}/{{inputs.parameters.agent-id}}/crashes.json"
          - name: regression-analysis
            path: /output/regression_analysis.json
            optional: true
            archive:
              none: {}
            gcs:
              bucket: "{{inputs.parameters.bucket}}"
              key: "results/{{inputs.parameters.experiment-id}}/{{inputs.parameters.case-id}}/{{inputs.parameters.agent-id}}/regression_analysis.json"
          - name: success-marker
            path: /output/_SUCCESS
            optional: true
            archive:
              none: {}
            gcs:
              bucket: "{{inputs.parameters.bucket}}"
              key: "results/{{inputs.parameters.experiment-id}}/{{inputs.parameters.case-id}}/{{inputs.parameters.agent-id}}/_SUCCESS"
      # NOTE: Memoization removed from fuzz-llm due to Argo bug with nested memoized tasks
      # Caching is now handled at the DAG level (per-model-pipeline) in arvo-benchmark.yaml
      # GCS _SUCCESS marker check below provides fallback deduplication

      # Disable AppArmor so SYS_ADMIN can actually mount overlayfs.
      metadata:
        annotations:
          container.apparmor.security.beta.kubernetes.io/main: unconfined
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "work"
          effect: "NoSchedule"
      nodeSelector:
        spot: "{{inputs.parameters.use-spot}}"
        workload-type: work
      serviceAccountName: arvo-workflow-sa
      retryStrategy:
        limit: 3
        retryPolicy: "Always"
        expression: 'lastRetry.status == "Error" or (lastRetry.status == "Failed" and asInt(lastRetry.exitCode) not in [0])'
        backoff:
          duration: "30s"
          factor: 2
          cap: "5m"

      # On OOM retries (retry 2+), escalate memory request to 16G so the pod
      # lands on an n4-highmem-4 node (32GB) instead of n4-standard-4 (16GB).
      podSpecPatch: |
        containers:
        - name: main
          resources:
            requests:
              memory: "{{= sprig.int(retries) >= 1 ? '13G' : '6G'}}"
            limits:
              memory: "{{= sprig.int(retries) >= 1 ? '28G' : '12G'}}"

      activeDeadlineSeconds: 7200

      initContainers:
        - name: fetch-runtime
          image: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
          command:
            - /bin/bash
            - -c
            - |
              set -e
              gsutil cp gs://{{inputs.parameters.bucket}}/agent-runtime/agent-runtime.tar.gz /tmp/
              tar -xzf /tmp/agent-runtime.tar.gz -C /agent-runtime --strip-components=1
              chmod +x /agent-runtime/bin/* 2>/dev/null || true
          volumeMounts:
            - name: agent-runtime
              mountPath: /agent-runtime

        # Download binaries for fuzzing and regression analysis
        - name: fetch-binary
          image: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
          command:
            - /bin/bash
            - -c
            - |
              set -e
              TARGET="{{inputs.parameters.target}}"
              BUCKET="{{inputs.parameters.bucket}}"
              EXPERIMENT_ID="{{inputs.parameters.experiment-id}}"
              CASE_ID="{{inputs.parameters.case-id}}"
              AGENT_ID="{{inputs.parameters.agent-id}}"

              # For LLM patches: download the rebuilt binary from patch results
              if [ "${TARGET}" = "llm_patch" ]; then
                # Download rebuilt binary from patch results (uses agent-id in path)
                gsutil cp gs://${BUCKET}/results/${EXPERIMENT_ID}/${CASE_ID}/${AGENT_ID}/rebuilt_binary /binary/rebuilt_binary || {
                  echo "Warning: Could not download rebuilt binary"
                  exit 0
                }
                chmod +x /binary/rebuilt_binary
              fi

              # Download original (pre-patch) binary for regression analysis
              # Stored per-case (not per-agent) since it's the same vul binary for all agents
              # Needed for both GT and LLM patches to measure regressions
              gsutil cp gs://${BUCKET}/results/${EXPERIMENT_ID}/${CASE_ID}/original_binary /binary/original_binary 2>/dev/null || true
              [ -f /binary/original_binary ] && chmod +x /binary/original_binary || true
          volumeMounts:
            - name: binary
              mountPath: /binary

      container:
        image: "{{inputs.parameters.registry}}/arvo-{{inputs.parameters.case-id}}-fix:{{inputs.parameters.build-version}}"
        command:
          - /bin/bash
          - -c
          - |
            set -e
            TARGET="{{inputs.parameters.target}}"
            CASE_ID="{{inputs.parameters.case-id}}"
            AGENT_ID="{{inputs.parameters.agent-id}}"
            BUCKET="{{inputs.parameters.bucket}}"
            EXPERIMENT_ID="{{inputs.parameters.experiment-id}}"

            # Layer 2: Check if already completed in GCS (fallback when memoization cache cleared)
            SUCCESS_PATH="gs://${BUCKET}/results/${EXPERIMENT_ID}/${CASE_ID}/${AGENT_ID}/_SUCCESS"
            if gsutil -q stat "${SUCCESS_PATH}" 2>/dev/null; then
              echo "[SKIP] Results already exist at ${SUCCESS_PATH}"
              # Copy existing _SUCCESS to output for artifact upload consistency
              gsutil cp "${SUCCESS_PATH}" /output/_SUCCESS
              exit 0
            fi

            # Build command (--model passes agent-id for result tracking)
            CMD="/agent-runtime/bin/agent-entrypoint.sh python3 -m evaluation.main \
              --case-id ${CASE_ID} \
              --model ${AGENT_ID} \
              --target ${TARGET} \
              --duration {{inputs.parameters.fuzzing-duration}} \
              --output-dir /output \
              --verbose"

            # Add binary paths for LLM patches
            if [ "${TARGET}" = "llm_patch" ] && [ -f /binary/rebuilt_binary ]; then
              CMD="${CMD} --binary-path /binary/rebuilt_binary"
            fi

            # Add original binary for regression analysis (both GT and LLM patches)
            if [ -f /binary/original_binary ]; then
              CMD="${CMD} --original-binary-path /binary/original_binary"
            fi

            # Run fuzzing
            eval ${CMD}

            # Write completion marker (Argo artifacts handle upload)
            # This marker is uploaded last, so its presence indicates all results uploaded successfully
            cat > /output/_SUCCESS << EOF
            {
              "completed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "pod": "{{pod.name}}",
              "case_id": "${CASE_ID}",
              "target": "${TARGET}",
              "agent_id": "${AGENT_ID}"
            }
            EOF
        env:
          - name: PYTHONPATH
            value: "/agent-runtime"
        volumeMounts:
          - name: agent-runtime
            mountPath: /agent-runtime
            readOnly: true
          - name: binary
            mountPath: /binary
            readOnly: true
          - name: output
            mountPath: /output
        resources:
          requests:
            cpu: "1.7"
            memory: "6G"
          limits:
            cpu: "1.8"
            memory: "14G"
        securityContext:
          capabilities:
            add: ["SYS_ADMIN"]

      volumes:
        - name: agent-runtime
          emptyDir: {}
        - name: binary
          emptyDir: {}
        - name: output
          emptyDir: {}
