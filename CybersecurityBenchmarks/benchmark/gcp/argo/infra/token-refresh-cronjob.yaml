apiVersion: batch/v1
kind: CronJob
metadata:
  name: gcs-token-refresh
  namespace: argo
spec:
  schedule: "*/30 * * * *" # Every 30 minutes
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: arvo-workflow-sa # Uses workload identity
          containers:
            - name: refresh
              image: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -e
                  echo "Fetching GCS access token..."
                  TOKEN=$(gcloud auth print-access-token)

                  echo "Updating gcs-auth-token secret via Kubernetes API..."
                  # Get service account token for K8s API auth
                  K8S_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                  K8S_CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  K8S_NS=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
                  K8S_API="https://kubernetes.default.svc"

                  # Base64 encode the token value
                  TOKEN_B64=$(echo -n "Bearer $TOKEN" | base64 | tr -d '\n')

                  # Create/update secret via K8s API
                  SECRET_JSON=$(cat <<EOF
                  {
                    "apiVersion": "v1",
                    "kind": "Secret",
                    "metadata": {
                      "name": "gcs-auth-token",
                      "namespace": "${K8S_NS}"
                    },
                    "data": {
                      "token": "${TOKEN_B64}"
                    }
                  }
                  EOF
                  )

                  # Try to create, if exists then patch
                  HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
                    --cacert $K8S_CA \
                    -H "Authorization: Bearer $K8S_TOKEN" \
                    -H "Content-Type: application/json" \
                    -X POST \
                    -d "$SECRET_JSON" \
                    "$K8S_API/api/v1/namespaces/${K8S_NS}/secrets")

                  if [ "$HTTP_CODE" = "201" ]; then
                    echo "Secret created successfully"
                  elif [ "$HTTP_CODE" = "409" ]; then
                    # Secret exists, update it
                    HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
                      --cacert $K8S_CA \
                      -H "Authorization: Bearer $K8S_TOKEN" \
                      -H "Content-Type: application/json" \
                      -X PUT \
                      -d "$SECRET_JSON" \
                      "$K8S_API/api/v1/namespaces/${K8S_NS}/secrets/gcs-auth-token")
                    if [ "$HTTP_CODE" = "200" ]; then
                      echo "Secret updated successfully"
                    else
                      echo "Failed to update secret: $HTTP_CODE"
                      cat /tmp/response.txt
                      exit 1
                    fi
                  else
                    echo "Failed to create secret: $HTTP_CODE"
                    cat /tmp/response.txt
                    exit 1
                  fi

                  echo "Token refreshed successfully"
          restartPolicy: OnFailure
---
# RBAC: Allow the workflow SA to manage the token secret
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gcs-token-manager
  namespace: argo
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["gcs-auth-token"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"] # Needed for initial creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gcs-token-manager-binding
  namespace: argo
subjects:
  - kind: ServiceAccount
    name: arvo-workflow-sa
    namespace: argo
roleRef:
  kind: Role
  name: gcs-token-manager
  apiGroup: rbac.authorization.k8s.io
---
# Service account token secret (needed for K8s 1.24+ where auto-created tokens are projected)
apiVersion: v1
kind: Secret
metadata:
  name: arvo-workflow-sa.service-account-token
  namespace: argo
  annotations:
    kubernetes.io/service-account.name: arvo-workflow-sa
type: kubernetes.io/service-account-token
---
# RBAC: Allow workflow agent pods to access WorkflowTaskSets (for HTTP templates)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arvo-workflow-agent
  namespace: argo
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtasksets"]
    verbs: ["get", "watch", "list", "patch"]
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtasksets/status"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arvo-workflow-agent-binding
  namespace: argo
subjects:
  - kind: ServiceAccount
    name: arvo-workflow-sa
    namespace: argo
roleRef:
  kind: Role
  name: arvo-workflow-agent
  apiGroup: rbac.authorization.k8s.io
