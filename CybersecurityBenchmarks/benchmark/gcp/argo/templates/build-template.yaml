apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: arvo-build
  namespace: argo
spec:
  templates:
    - name: build-vul
      inputs:
        parameters:
          - name: case-id
          - name: build-version
          - name: bucket
          - name: registry
          # Optional: override the vul base image (for closest-vul mode).
          # When empty (default), uses upstream docker.io/n132/arvo:{case-id}-vul.
          # When set, uses the specified image (e.g. registry closest-vul image).
          - name: vul-base-image
            default: ""
      # NOTE: Memoization removed - image existence is checked via HTTP check-image
      # template in the DAG (Docker v2 manifests API) to avoid memoized retry nodes
      # creating empty children arrays that break assessDAGPhase BFS traversal.
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "build"
          effect: "NoSchedule"
      nodeSelector:
        cloud.google.com/gke-spot: "true"
        workload-type: build
      serviceAccountName: arvo-workflow-sa
      retryStrategy:
        limit: 3
        retryPolicy: "Always"
        expression: 'lastRetry.status == "Error" or (lastRetry.status == "Failed" and asInt(lastRetry.exitCode) not in [0])'
        backoff:
          duration: "30s"
          factor: 2
          cap: "10m"
      # BuildKit daemonless — replaces Kaniko.
      # Fixes OCI layer unpacking bugs (e.g. case 57448 mkdir file-exists error).
      # Requires privileged mode for overlayfs snapshotting.
      container:
        image: moby/buildkit:buildx-stable-1
        securityContext:
          privileged: true
        env:
          - name: DOCKER_CONFIG
            value: "/auth"
        command: ["buildctl-daemonless.sh"]
        args:
          - "build"
          - "--frontend=dockerfile.v0"
          - "--local=context=/workspace"
          - "--local=dockerfile=/workspace"
          - '--output=type=image,"name={{inputs.parameters.registry}}/arvo-{{inputs.parameters.case-id}}-vul:{{inputs.parameters.build-version}},{{inputs.parameters.registry}}/arvo-{{inputs.parameters.case-id}}-vul:latest",push=true'
          - "--export-cache=type=registry,ref={{inputs.parameters.registry}}/buildkit-cache:vul,mode=max"
          - "--import-cache=type=registry,ref={{inputs.parameters.registry}}/buildkit-cache:vul"
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: auth
            mountPath: /auth
            readOnly: true
        resources:
          requests:
            cpu: "7"
            memory: "16G"
          limits:
            cpu: "7"
            memory: "16G"
      initContainers:
        - name: prepare-build-context
          image: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
          command:
            - /bin/bash
            - -c
            - |
              set -e
              CASE_ID="{{inputs.parameters.case-id}}"
              BUCKET="{{inputs.parameters.bucket}}"

              # Download Dockerfile template and build assets
              gsutil cp gs://${BUCKET}/build-assets/dockerfile_vul_template /workspace/
              gsutil cp -r gs://${BUCKET}/build-assets/libfuzzer-modern/ /workspace/ || true

              # Determine vul base image (default: upstream, or override for closest-vul)
              VUL_BASE_IMAGE="{{inputs.parameters.vul-base-image}}"
              if [ -z "$VUL_BASE_IMAGE" ]; then
                VUL_BASE_IMAGE="docker.io/n132/arvo:${CASE_ID}-vul"
              fi
              echo "Vul base image: $VUL_BASE_IMAGE"

              # Generate Dockerfile from template
              sed -e "s|{ARVO_ID}|${CASE_ID}|g" \
                  -e "s|{VUL_BASE_IMAGE}|${VUL_BASE_IMAGE}|g" \
                  /workspace/dockerfile_vul_template > /workspace/Dockerfile
          volumeMounts:
            - name: workspace
              mountPath: /workspace
        # Merge Docker Hub pull creds + Artifact Registry push token into a
        # single config.json that BuildKit can use for both pull and push.
        - name: prepare-registry-auth
          image: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
          command:
            - /bin/bash
            - -c
            - |
              set -e
              # Start with Docker Hub creds if they exist
              if [ -f /docker-secret/.dockerconfigjson ]; then
                cp /docker-secret/.dockerconfigjson /auth/config.json
              else
                echo '{"auths":{}}' > /auth/config.json
              fi
              # Add Artifact Registry token
              TOKEN=$(gcloud auth print-access-token)
              REGISTRY_HOST=$(echo "{{inputs.parameters.registry}}" | cut -d/ -f1)
              python3 -c "
              import json, os
              cfg = json.load(open('/auth/config.json'))
              cfg.setdefault('auths', {})['https://${REGISTRY_HOST}'] = {
                  'auth': '$(echo -n "oauth2accesstoken:${TOKEN}" | base64 -w0)'
              }
              json.dump(cfg, open('/auth/config.json', 'w'))
              "
              echo "Registry auth configured for Docker Hub + ${REGISTRY_HOST}"
          volumeMounts:
            - name: docker-secret
              mountPath: /docker-secret
              readOnly: true
            - name: auth
              mountPath: /auth
      volumes:
        - name: workspace
          emptyDir: {}
        # Raw Docker Hub secret (read by prepare-registry-auth init container)
        - name: docker-secret
          secret:
            secretName: dockerhub-registry
            optional: true
        # Merged auth config (Docker Hub + Artifact Registry)
        - name: auth
          emptyDir: {}

    - name: build-fix
      inputs:
        parameters:
          - name: case-id
          - name: build-version
          - name: bucket
          - name: registry
      # NOTE: Memoization removed - image existence is checked via HTTP check-image
      # template in the DAG (Docker v2 manifests API) to avoid memoized retry nodes
      # creating empty children arrays that break assessDAGPhase BFS traversal.
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "build"
          effect: "NoSchedule"
      nodeSelector:
        cloud.google.com/gke-spot: "true"
        workload-type: build
      serviceAccountName: arvo-workflow-sa
      retryStrategy:
        limit: 3
        retryPolicy: "Always"
        expression: 'lastRetry.status == "Error" or (lastRetry.status == "Failed" and asInt(lastRetry.exitCode) not in [0])'
        backoff:
          duration: "30s"
          factor: 2
          cap: "10m"
      # BuildKit daemonless — replaces Kaniko.
      # Fixes OCI layer unpacking bugs (e.g. case 57448 mkdir file-exists error).
      # Requires privileged mode for overlayfs snapshotting.
      # No --single-snapshot equivalent needed; BuildKit uses overlayfs natively.
      container:
        image: moby/buildkit:buildx-stable-1
        securityContext:
          privileged: true
        env:
          - name: DOCKER_CONFIG
            value: "/auth"
        command: ["buildctl-daemonless.sh"]
        args:
          - "build"
          - "--frontend=dockerfile.v0"
          - "--local=context=/workspace"
          - "--local=dockerfile=/workspace"
          - '--output=type=image,"name={{inputs.parameters.registry}}/arvo-{{inputs.parameters.case-id}}-fix:{{inputs.parameters.build-version}},{{inputs.parameters.registry}}/arvo-{{inputs.parameters.case-id}}-fix:latest",push=true'
          - "--export-cache=type=registry,ref={{inputs.parameters.registry}}/buildkit-cache:fix,mode=max"
          - "--import-cache=type=registry,ref={{inputs.parameters.registry}}/buildkit-cache:fix"
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: auth
            mountPath: /auth
            readOnly: true
        resources:
          requests:
            cpu: "7"
            memory: "24G"
          limits:
            cpu: "7"
            memory: "24G"
      initContainers:
        - name: prepare-build-context
          image: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
          command:
            - /bin/bash
            - -c
            - |
              set -e
              CASE_ID="{{inputs.parameters.case-id}}"
              BUCKET="{{inputs.parameters.bucket}}"

              # Download Dockerfile template and build assets
              gsutil cp gs://${BUCKET}/build-assets/dockerfile_fuzzing_template /workspace/
              gsutil cp gs://${BUCKET}/build-assets/casr-binaries.tar.gz /workspace/ || true
              gsutil cp gs://${BUCKET}/build-assets/libc6_2.35-0ubuntu3_amd64.deb /workspace/ || true
              gsutil cp -r gs://${BUCKET}/build-assets/libfuzzer-modern/ /workspace/ || true
              gsutil cp gs://${BUCKET}/build-assets/differential-debugging-deps-16.04.deb /workspace/ || true
              gsutil cp gs://${BUCKET}/build-assets/differential-debugging-deps-20.04.deb /workspace/ || true
              gsutil cp -r gs://${BUCKET}/build-assets/microsnapshots/ /workspace/ || true

              # Generate Dockerfile from template
              sed "s|{ARVO_ID}|${CASE_ID}|g" /workspace/dockerfile_fuzzing_template > /workspace/Dockerfile
          volumeMounts:
            - name: workspace
              mountPath: /workspace
        # Merge Docker Hub pull creds + Artifact Registry push token into a
        # single config.json that BuildKit can use for both pull and push.
        - name: prepare-registry-auth
          image: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
          command:
            - /bin/bash
            - -c
            - |
              set -e
              # Start with Docker Hub creds if they exist
              if [ -f /docker-secret/.dockerconfigjson ]; then
                cp /docker-secret/.dockerconfigjson /auth/config.json
              else
                echo '{"auths":{}}' > /auth/config.json
              fi
              # Add Artifact Registry token
              TOKEN=$(gcloud auth print-access-token)
              REGISTRY_HOST=$(echo "{{inputs.parameters.registry}}" | cut -d/ -f1)
              python3 -c "
              import json, os
              cfg = json.load(open('/auth/config.json'))
              cfg.setdefault('auths', {})['https://${REGISTRY_HOST}'] = {
                  'auth': '$(echo -n "oauth2accesstoken:${TOKEN}" | base64 -w0)'
              }
              json.dump(cfg, open('/auth/config.json', 'w'))
              "
              echo "Registry auth configured for Docker Hub + ${REGISTRY_HOST}"
          volumeMounts:
            - name: docker-secret
              mountPath: /docker-secret
              readOnly: true
            - name: auth
              mountPath: /auth
      volumes:
        - name: workspace
          emptyDir: {}
        # Raw Docker Hub secret (read by prepare-registry-auth init container)
        - name: docker-secret
          secret:
            secretName: dockerhub-registry
            optional: true
        # Merged auth config (Docker Hub + Artifact Registry)
        - name: auth
          emptyDir: {}
