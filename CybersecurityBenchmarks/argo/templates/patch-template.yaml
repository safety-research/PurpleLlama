apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: arvo-patch
  namespace: argo
spec:
  templates:
    - name: patch-case
      inputs:
        parameters:
          - name: case-id
          - name: project # Project name from metadata (e.g., "wireshark", "php-src")
          - name: model # LLM model name (for semaphore rate limiting)
          - name: agent-id # Unique agent identifier (for GCS paths, task naming)
          - name: agent-config # JSON blob passed to agent runtime
          - name: experiment-id
          - name: bucket
          - name: registry
          - name: build-version
          - name: use-spot
            value: "true"
      # Per-model rate limiting via semaphore (keyed by LLM model, not agent-id)
      # If the model key doesn't exist in the ConfigMap, jobs run unlimited
      # Configure limits with: python -m cli semaphore set <model> <limit>
      synchronization:
        semaphore:
          configMapKeyRef:
            name: patch-semaphores
            key: "{{inputs.parameters.model}}"
      # Outputs for memoization and artifact upload
      outputs:
        parameters:
          - name: patch-key
            value: "{{inputs.parameters.case-id}}-{{inputs.parameters.agent-id}}-{{inputs.parameters.experiment-id}}"
        artifacts:
          - name: result
            path: /output/result.json
            archive:
              none: {}
            gcs:
              bucket: "{{inputs.parameters.bucket}}"
              key: "results/{{inputs.parameters.experiment-id}}/{{inputs.parameters.case-id}}/{{inputs.parameters.agent-id}}/result.json"
          - name: patch
            path: /output/patch.patch
            optional: true
            archive:
              none: {}
            gcs:
              bucket: "{{inputs.parameters.bucket}}"
              key: "results/{{inputs.parameters.experiment-id}}/{{inputs.parameters.case-id}}/{{inputs.parameters.agent-id}}/patch.patch"
          - name: chat
            path: /output/chat.md
            optional: true
            archive:
              none: {}
            gcs:
              bucket: "{{inputs.parameters.bucket}}"
              key: "results/{{inputs.parameters.experiment-id}}/{{inputs.parameters.case-id}}/{{inputs.parameters.agent-id}}/chat.md"
          - name: conversation
            path: /output/conversation.json
            optional: true
            archive:
              none: {}
            gcs:
              bucket: "{{inputs.parameters.bucket}}"
              key: "results/{{inputs.parameters.experiment-id}}/{{inputs.parameters.case-id}}/{{inputs.parameters.agent-id}}/conversation.json"
          - name: rebuilt-binary
            path: /output/rebuilt_binary
            optional: true
            archive:
              none: {}
            gcs:
              bucket: "{{inputs.parameters.bucket}}"
              key: "results/{{inputs.parameters.experiment-id}}/{{inputs.parameters.case-id}}/{{inputs.parameters.agent-id}}/rebuilt_binary"
          - name: success-marker
            path: /output/_SUCCESS
            optional: true
            archive:
              none: {}
            gcs:
              bucket: "{{inputs.parameters.bucket}}"
              key: "results/{{inputs.parameters.experiment-id}}/{{inputs.parameters.case-id}}/{{inputs.parameters.agent-id}}/patch/_SUCCESS"
      # NOTE: Memoization removed - using HTTP-based GCS completion checks instead
      # See per-model-pipeline DAG in arvo-benchmark.yaml for check-completion template

      # Disable AppArmor so SYS_ADMIN can actually mount overlayfs.
      # GKE's default cri-containerd.apparmor.d profile blocks mount() even
      # with CAP_SYS_ADMIN.
      metadata:
        annotations:
          container.apparmor.security.beta.kubernetes.io/main: unconfined
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "work"
          effect: "NoSchedule"
      nodeSelector:
        spot: "{{inputs.parameters.use-spot}}"
        workload-type: work
      serviceAccountName: arvo-workflow-sa
      retryStrategy:
        limit: 3
        retryPolicy: "Always"
        expression: 'lastRetry.status == "Error" or (lastRetry.status == "Failed" and asInt(lastRetry.exitCode) not in [0])'
        backoff:
          duration: "30s"
          factor: 2
          cap: "5m"

      # On retries, escalate resources so the pod lands on a larger node.
      # - CPU: 1.7 -> 3.5 (helps compilation-heavy cases like 9180, 3438)
      # - Memory: 6G -> 13G request so the pod targets n4-highmem-4 (32GB)
      # Retries are triggered by exit code 2 (escalation timeout: agent ran
      # >= 30 min without fixing the crash) or pod-level errors (OOM, eviction).
      podSpecPatch: |
        containers:
        - name: main
          resources:
            requests:
              cpu: "{{= sprig.int(retries) >= 1 ? '3.5' : '1.7'}}"
              memory: "{{= sprig.int(retries) >= 1 ? '13G' : '6G'}}"
            limits:
              cpu: "{{= sprig.int(retries) >= 1 ? '3.8' : '1.8'}}"
              memory: "{{= sprig.int(retries) >= 1 ? '28G' : '12G'}}"

      activeDeadlineSeconds: 86400

      initContainers:
        - name: fetch-runtime
          image: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
          command:
            - /bin/bash
            - -c
            - |
              set -e
              gsutil cp gs://{{inputs.parameters.bucket}}/agent-runtime/agent-runtime.tar.gz /tmp/
              tar -xzf /tmp/agent-runtime.tar.gz -C /agent-runtime --strip-components=1
              chmod +x /agent-runtime/bin/* 2>/dev/null || true
          volumeMounts:
            - name: agent-runtime
              mountPath: /agent-runtime

      container:
        image: "{{inputs.parameters.registry}}/arvo-{{inputs.parameters.case-id}}-vul:{{inputs.parameters.build-version}}"
        command:
          - /bin/bash
          - -c
          - |
            set -e
            CASE_ID="{{inputs.parameters.case-id}}"
            AGENT_ID="{{inputs.parameters.agent-id}}"
            BUCKET="{{inputs.parameters.bucket}}"
            EXPERIMENT_ID="{{inputs.parameters.experiment-id}}"

            # Fallback check: skip if already completed in GCS (belt and suspenders with HTTP check)
            SUCCESS_PATH="gs://${BUCKET}/results/${EXPERIMENT_ID}/${CASE_ID}/${AGENT_ID}/patch/_SUCCESS"
            if gsutil -q stat "${SUCCESS_PATH}" 2>/dev/null; then
              echo "[SKIP] Patch already completed at ${SUCCESS_PATH}"
              # Copy existing _SUCCESS to output for artifact upload consistency
              gsutil cp "${SUCCESS_PATH}" /output/_SUCCESS
              exit 0
            fi

            # Run the agent -- it handles everything:
            # - Patching source code
            # - Compiling and verifying the fix
            # - Saving rebuilt_binary, patch.patch, result.json to /output
            # Temporarily disable set -e so we can capture the exit code.
            # Exit code 2 = escalation timeout (agent ran >= 30 min without success),
            # triggers Argo retry with more CPU via podSpecPatch.
            set +e
            /agent-runtime/bin/agent-entrypoint.sh python3 -m agent.main \
              --case-id ${CASE_ID} \
              --output-dir /output \
              --verbose
            EXIT_CODE=$?
            set -e

            if [ $EXIT_CODE -ne 0 ]; then
              echo "[RETRY] Agent exited with code $EXIT_CODE — skipping _SUCCESS marker"
              exit $EXIT_CODE
            fi

            # Write completion marker (Argo artifacts handle upload)
            # This marker is uploaded last, so its presence indicates all results uploaded successfully
            cat > /output/_SUCCESS << EOF
            {
              "completed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "pod": "{{pod.name}}",
              "case_id": "${CASE_ID}",
              "agent_id": "${AGENT_ID}"
            }
            EOF
        env:
          - name: ANTHROPIC_API_KEY
            valueFrom:
              secretKeyRef:
                name: anthropic-api-key
                key: key
          - name: PYTHONPATH
            value: "/agent-runtime"
          - name: AGENT_CONFIG
            value: "{{inputs.parameters.agent-config}}"
          - name: BUCKET
            value: "{{inputs.parameters.bucket}}"
          - name: PROJECT
            value: "{{inputs.parameters.project}}"
          - name: ARGO_RETRIES
            value: "{{retries}}"
        volumeMounts:
          - name: agent-runtime
            mountPath: /agent-runtime
            readOnly: true
          - name: output
            mountPath: /output
        resources:
          requests:
            cpu: "1.7"
            memory: "6G"
          limits:
            cpu: "1.8"
            memory: "14G"
        # SYS_ADMIN enables overlayfs for instant source revert between retries
        securityContext:
          capabilities:
            add: ["SYS_ADMIN"]

      volumes:
        - name: agent-runtime
          emptyDir: {}
        - name: output
          emptyDir: {}
