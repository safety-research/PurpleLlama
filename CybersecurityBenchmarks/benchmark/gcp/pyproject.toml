[project]
name = "arvo-gcp-cli"
version = "0.1.0"
description = "CLI for managing ARVO benchmark jobs on GCP Cloud Batch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "numpy>=2.2.6",
    "matplotlib>=3.10.8",
]

[project.scripts]
arvo-gcp = "cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli"]
