apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: arvo-patch
  namespace: argo
spec:
  templates:
    - name: patch-case
      inputs:
        parameters:
          - name: case-id
          - name: model
          - name: experiment-id
          - name: bucket
          - name: registry
          - name: build-version
          - name: use-spot
            value: "true"
      # Per-model rate limiting via semaphore
      # If the model key doesn't exist in the ConfigMap, jobs run unlimited
      # Configure limits with: python -m cli semaphore set <model> <limit>
      synchronization:
        semaphore:
          configMapKeyRef:
            name: patch-semaphores
            key: "{{inputs.parameters.model}}"
      # Outputs for memoization and artifact upload
      outputs:
        parameters:
          - name: patch-key
            value: "{{inputs.parameters.case-id}}-{{inputs.parameters.model}}-{{inputs.parameters.experiment-id}}"
        artifacts:
          - name: result
            path: /output/result.json
            archive:
              none: {}
            gcs:
              bucket: "{{inputs.parameters.bucket}}"
              key: "results/{{inputs.parameters.experiment-id}}/{{inputs.parameters.case-id}}/{{inputs.parameters.model}}/result.json"
          - name: patch
            path: /output/patch.txt
            optional: true
            archive:
              none: {}
            gcs:
              bucket: "{{inputs.parameters.bucket}}"
              key: "results/{{inputs.parameters.experiment-id}}/{{inputs.parameters.case-id}}/{{inputs.parameters.model}}/patch.txt"
          - name: chat
            path: /output/chat.md
            optional: true
            archive:
              none: {}
            gcs:
              bucket: "{{inputs.parameters.bucket}}"
              key: "results/{{inputs.parameters.experiment-id}}/{{inputs.parameters.case-id}}/{{inputs.parameters.model}}/chat.md"
          - name: rebuilt-binary
            path: /output/rebuilt_binary
            optional: true
            archive:
              none: {}
            gcs:
              bucket: "{{inputs.parameters.bucket}}"
              key: "results/{{inputs.parameters.experiment-id}}/{{inputs.parameters.case-id}}/{{inputs.parameters.model}}/rebuilt_binary"
          - name: success-marker
            path: /output/_SUCCESS
            optional: true
            archive:
              none: {}
            gcs:
              bucket: "{{inputs.parameters.bucket}}"
              key: "results/{{inputs.parameters.experiment-id}}/{{inputs.parameters.case-id}}/{{inputs.parameters.model}}/patch/_SUCCESS"
      # NOTE: Memoization removed - using HTTP-based GCS completion checks instead
      # See per-model-pipeline DAG in arvo-benchmark.yaml for check-completion template
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "work"
          effect: "NoSchedule"
      nodeSelector:
        cloud.google.com/gke-spot: "{{inputs.parameters.use-spot}}"
        workload-type: work
      serviceAccountName: arvo-workflow-sa
      retryStrategy:
        limit: 3
        retryPolicy: "Always"
        expression: 'lastRetry.status == "Error" or (lastRetry.status == "Failed" and asInt(lastRetry.exitCode) not in [0])'
        backoff:
          duration: "30s"
          factor: 2
          cap: "5m"

      activeDeadlineSeconds: 7200

      initContainers:
        - name: fetch-runtime
          image: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
          command:
            - /bin/bash
            - -c
            - |
              set -e
              gsutil cp gs://{{inputs.parameters.bucket}}/agent-runtime/agent-runtime.tar.gz /tmp/
              tar -xzf /tmp/agent-runtime.tar.gz -C /agent-runtime --strip-components=1
              chmod +x /agent-runtime/bin/* 2>/dev/null || true
          volumeMounts:
            - name: agent-runtime
              mountPath: /agent-runtime

      container:
        image: "{{inputs.parameters.registry}}/arvo-{{inputs.parameters.case-id}}-vul:{{inputs.parameters.build-version}}"
        command:
          - /bin/bash
          - -c
          - |
            set -e
            CASE_ID="{{inputs.parameters.case-id}}"
            MODEL="{{inputs.parameters.model}}"
            BUCKET="{{inputs.parameters.bucket}}"
            EXPERIMENT_ID="{{inputs.parameters.experiment-id}}"

            # Fallback check: skip if already completed in GCS (belt and suspenders with HTTP check)
            SUCCESS_PATH="gs://${BUCKET}/results/${EXPERIMENT_ID}/${CASE_ID}/${MODEL}/patch/_SUCCESS"
            if gsutil -q stat "${SUCCESS_PATH}" 2>/dev/null; then
              echo "[SKIP] Patch already completed at ${SUCCESS_PATH}"
              # Copy existing _SUCCESS to output for artifact upload consistency
              gsutil cp "${SUCCESS_PATH}" /output/_SUCCESS
              exit 0
            fi

            /agent-runtime/bin/agent-entrypoint.sh python3 -m agent.main \
              --case-id ${CASE_ID} \
              --agent autopatchbench \
              --model ${MODEL} \
              --output-dir /output \
              --verbose

            # Copy rebuilt binary to output if crash was fixed (Argo artifacts handle upload)
            if grep -q '"crash_fixed": true' /output/result.json 2>/dev/null; then
              FUZZER_BINARY=$(cat /bin/arvo 2>/dev/null | grep -oE '/out/[a-zA-Z0-9_.-]+' | head -1)
              if [ -n "${FUZZER_BINARY}" ] && [ -f "${FUZZER_BINARY}" ]; then
                cp "${FUZZER_BINARY}" /output/rebuilt_binary
              fi
            fi

            # Write completion marker (Argo artifacts handle upload)
            # This marker is uploaded last, so its presence indicates all results uploaded successfully
            cat > /output/_SUCCESS << EOF
            {
              "completed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "pod": "{{pod.name}}",
              "case_id": "${CASE_ID}",
              "model": "${MODEL}"
            }
            EOF
        env:
          - name: ANTHROPIC_API_KEY
            valueFrom:
              secretKeyRef:
                name: anthropic-api-key
                key: key
          - name: PYTHONPATH
            value: "/agent-runtime"
        volumeMounts:
          - name: agent-runtime
            mountPath: /agent-runtime
            readOnly: true
          - name: output
            mountPath: /output
        resources:
          requests:
            cpu: "1.7"
            memory: "6G"
          limits:
            cpu: "1.8"
            memory: "12G"

      volumes:
        - name: agent-runtime
          emptyDir: {}
        - name: output
          emptyDir: {}
