apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: arvo-benchmark-
  namespace: argo
spec:
  entrypoint: benchmark-pipeline
  serviceAccountName: arvo-workflow-sa

  # Resource quota for parallel execution
  parallelism: 500

  # Propagate labels to all pods (for GCP resource tracking)
  podMetadata:
    labels:
      owner: "{{workflow.labels.owner}}"
      experiment: "{{workflow.parameters.experiment-id}}"
    annotations:
      owner: "{{workflow.labels.owner}}"

  arguments:
    parameters:
      - name: cases
        value: "[]"
      - name: models
        value: "[]"
      - name: model
        value: "claude-sonnet-4-20250514"
      - name: experiment-id
        value: "default"
      - name: bucket
        value: ""
      - name: registry
        value: ""
      - name: build-version
        value: "latest"
      - name: fuzzing-duration
        value: "300"
      - name: run-gt
        value: "true"
      # Dependency build flags
      - name: build-casr
        value: "false"
      - name: build-dd
        value: "false"

  templates:
    # Main entry point - builds deps first, then fans out to all cases
    - name: benchmark-pipeline
      dag:
        tasks:
          # Build CASR (if needed)
          - name: build-casr
            when: "{{workflow.parameters.build-casr}} == true"
            templateRef:
              name: arvo-deps-build
              template: build-casr
            arguments:
              parameters:
                - name: bucket
                  value: "{{workflow.parameters.bucket}}"
                - name: force-rebuild
                  value: "true"

          # Build DD (if needed)
          - name: build-dd
            when: "{{workflow.parameters.build-dd}} == true"
            templateRef:
              name: arvo-deps-build
              template: build-dd
            arguments:
              parameters:
                - name: bucket
                  value: "{{workflow.parameters.bucket}}"
                - name: force-rebuild
                  value: "true"

          # Process all cases (depends on dep builds)
          - name: process-case
            dependencies: [build-casr, build-dd]
            template: per-case-pipeline
            arguments:
              parameters:
                - name: case-id
                  value: "{{item}}"
            withParam: "{{workflow.parameters.cases}}"

    # Per-case pipeline with fine-grained dependencies
    - name: per-case-pipeline
      inputs:
        parameters:
          - name: case-id
      dag:
        tasks:
          # Build vulnerable image (for LLM patching)
          - name: build-vul
            templateRef:
              name: arvo-build
              template: build-vul
            arguments:
              parameters:
                - name: case-id
                  value: "{{inputs.parameters.case-id}}"
                - name: build-version
                  value: "{{workflow.parameters.build-version}}"
                - name: bucket
                  value: "{{workflow.parameters.bucket}}"
                - name: registry
                  value: "{{workflow.parameters.registry}}"

          # Build fixed image (for fuzzing)
          - name: build-fix
            templateRef:
              name: arvo-build
              template: build-fix
            arguments:
              parameters:
                - name: case-id
                  value: "{{inputs.parameters.case-id}}"
                - name: build-version
                  value: "{{workflow.parameters.build-version}}"
                - name: bucket
                  value: "{{workflow.parameters.bucket}}"
                - name: registry
                  value: "{{workflow.parameters.registry}}"

          # LLM Patch + Fuzz (iterates over all models)
          - name: model-pipeline
            dependencies: [build-fix, build-vul]
            template: per-model-pipeline
            arguments:
              parameters:
                - name: case-id
                  value: "{{inputs.parameters.case-id}}"
                - name: model
                  value: "{{item}}"
                - name: experiment-id
                  value: "{{workflow.parameters.experiment-id}}"
                - name: bucket
                  value: "{{workflow.parameters.bucket}}"
                - name: registry
                  value: "{{workflow.parameters.registry}}"
                - name: build-version
                  value: "{{workflow.parameters.build-version}}"
                - name: fuzzing-duration
                  value: "{{workflow.parameters.fuzzing-duration}}"
            withParam: "{{workflow.parameters.models}}"

          # GT Fuzz (depends only on fix build - runs parallel with model-pipeline!)
          - name: fuzz-gt
            dependencies: [build-fix]
            when: "{{workflow.parameters.run-gt}} == true"
            templateRef:
              name: arvo-fuzz
              template: fuzz-case
            arguments:
              parameters:
                - name: case-id
                  value: "{{inputs.parameters.case-id}}"
                - name: target
                  value: "ground_truth"
                - name: model
                  value: "gt"
                - name: experiment-id
                  value: "{{workflow.parameters.experiment-id}}"
                - name: bucket
                  value: "{{workflow.parameters.bucket}}"
                - name: registry
                  value: "{{workflow.parameters.registry}}"
                - name: build-version
                  value: "{{workflow.parameters.build-version}}"
                - name: fuzzing-duration
                  value: "{{workflow.parameters.fuzzing-duration}}"

    # HTTP template for sub-second GCS completion checks (no container needed)
    # Uses GCS JSON API to check if _SUCCESS marker exists
    # Success (200) = file exists = skip task, Failure (404) = file missing = run task
    - name: check-completion
      inputs:
        parameters:
          - name: bucket
          - name: path  # URL-encoded path to _SUCCESS marker
      http:
        url: "https://storage.googleapis.com/storage/v1/b/{{inputs.parameters.bucket}}/o/{{inputs.parameters.path}}"
        method: GET
        headers:
          - name: Authorization
            valueFrom:
              secretKeyRef:
                name: gcs-auth-token
                key: token
        successCondition: response.statusCode == 200

    # Per-model pipeline: patch -> fuzz-llm for a single model
    # Uses HTTP checks to skip completed tasks (no Argo memoization - avoids nested DAG bugs)
    - name: per-model-pipeline
      inputs:
        parameters:
          - name: case-id
          - name: model
          - name: experiment-id
          - name: bucket
          - name: registry
          - name: build-version
          - name: fuzzing-duration
      dag:
        tasks:
          # Check if patch is already done (sub-second HTTP check)
          # continueOn.failed allows DAG to proceed even when check returns 404
          - name: check-patch-done
            template: check-completion
            continueOn:
              failed: true
            arguments:
              parameters:
                - name: bucket
                  value: "{{inputs.parameters.bucket}}"
                - name: path
                  value: "results%2F{{inputs.parameters.experiment-id}}%2F{{inputs.parameters.case-id}}%2F{{inputs.parameters.model}}%2Fpatch%2F_SUCCESS"

          # Run patch only if not already done (404 = not found = need to run)
          - name: patch
            dependencies: [check-patch-done]
            when: "{{tasks.check-patch-done.status}} == Failed"
            templateRef:
              name: arvo-patch
              template: patch-case
            arguments:
              parameters:
                - name: case-id
                  value: "{{inputs.parameters.case-id}}"
                - name: model
                  value: "{{inputs.parameters.model}}"
                - name: experiment-id
                  value: "{{inputs.parameters.experiment-id}}"
                - name: bucket
                  value: "{{inputs.parameters.bucket}}"
                - name: registry
                  value: "{{inputs.parameters.registry}}"
                - name: build-version
                  value: "{{inputs.parameters.build-version}}"

          # Check if fuzz is already done (runs after patch check and patch task)
          # continueOn.failed allows DAG to proceed even when check returns 404
          - name: check-fuzz-done
            dependencies: [check-patch-done, patch]
            template: check-completion
            continueOn:
              failed: true
            arguments:
              parameters:
                - name: bucket
                  value: "{{inputs.parameters.bucket}}"
                - name: path
                  value: "results%2F{{inputs.parameters.experiment-id}}%2F{{inputs.parameters.case-id}}%2F{{inputs.parameters.model}}%2F_SUCCESS"

          # Run fuzz only if not already done
          - name: fuzz-llm
            dependencies: [check-fuzz-done]
            when: "{{tasks.check-fuzz-done.status}} == Failed"
            templateRef:
              name: arvo-fuzz
              template: fuzz-case
            arguments:
              parameters:
                - name: case-id
                  value: "{{inputs.parameters.case-id}}"
                - name: target
                  value: "llm_patch"
                - name: model
                  value: "{{inputs.parameters.model}}"
                - name: experiment-id
                  value: "{{inputs.parameters.experiment-id}}"
                - name: bucket
                  value: "{{inputs.parameters.bucket}}"
                - name: registry
                  value: "{{inputs.parameters.registry}}"
                - name: build-version
                  value: "{{inputs.parameters.build-version}}"
                - name: fuzzing-duration
                  value: "{{inputs.parameters.fuzzing-duration}}"
