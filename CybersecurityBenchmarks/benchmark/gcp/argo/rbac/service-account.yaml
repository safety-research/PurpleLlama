apiVersion: v1
kind: ServiceAccount
metadata:
  name: arvo-workflow-sa
  namespace: argo
  annotations:
    # Workload Identity binding - set by setup.py or manually:
    # iam.gke.io/gcp-service-account: {username}-arvo-runner@{project}.iam.gserviceaccount.com
# Docker Hub authentication to avoid rate limiting.
# Create the secret with: python -m cli secrets sync-docker
imagePullSecrets:
  - name: dockerhub-registry
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arvo-workflow-role
  namespace: argo
rules:
  # Workflow execution needs
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
  # For memoization cache
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # For secrets (API keys)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  # For workflow artifacts
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arvo-workflow-rolebinding
  namespace: argo
subjects:
  - kind: ServiceAccount
    name: arvo-workflow-sa
    namespace: argo
roleRef:
  kind: Role
  name: arvo-workflow-role
  apiGroup: rbac.authorization.k8s.io
---
# Grant the Argo Workflow Controller access to manage memoization cache configmaps.
# The controller (running as 'argo' SA) manages cache entries, not the workflow SA.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-controller-cache-role
  namespace: argo
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-controller-cache-rolebinding
  namespace: argo
subjects:
  - kind: ServiceAccount
    name: argo
    namespace: argo
roleRef:
  kind: Role
  name: argo-controller-cache-role
  apiGroup: rbac.authorization.k8s.io
