apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: arvo-benchmark-
  namespace: argo
spec:
  entrypoint: benchmark-pipeline
  serviceAccountName: arvo-workflow-sa

  # Resource quota for parallel execution
  parallelism: 500

  # Propagate labels to all pods (for GCP resource tracking)
  podMetadata:
    labels:
      owner: "{{workflow.labels.owner}}"
      experiment: "{{workflow.parameters.experiment-id}}"
    annotations:
      owner: "{{workflow.labels.owner}}"

  arguments:
    parameters:
      - name: model
        value: "claude-sonnet-4-20250514"
      - name: experiment-id
        value: "default"
      - name: bucket
        value: ""
      - name: registry
        value: ""
      - name: build-version
        value: "latest"
      - name: fuzzing-duration
        value: "300"
      - name: run-gt
        value: "true"
      # Dependency build flags
      - name: build-casr
        value: "false"
      - name: build-dd
        value: "false"

  templates:
    # Main entry point - FLAT DAG with all tasks inlined (no withParam, no nested DAGs)
    # Tasks are dynamically generated by the CLI based on cases and models
    - name: benchmark-pipeline
      dag:
        tasks:
          # Build CASR (if needed)
          - name: build-casr
            when: "{{workflow.parameters.build-casr}} == true"
            templateRef:
              name: arvo-deps-build
              template: build-casr
            arguments:
              parameters:
                - name: bucket
                  value: "{{workflow.parameters.bucket}}"
                - name: force-rebuild
                  value: "true"

          # Build DD (if needed)
          - name: build-dd
            when: "{{workflow.parameters.build-dd}} == true"
            templateRef:
              name: arvo-deps-build
              template: build-dd
            arguments:
              parameters:
                - name: bucket
                  value: "{{workflow.parameters.bucket}}"
                - name: force-rebuild
                  value: "true"

          # PLACEHOLDER: Case and model tasks are dynamically inserted here by the CLI
          # The CLI generates: build-vul-{case}, build-fix-{case}, check-patch-done-{case}-{model},
          # patch-{case}-{model}, check-fuzz-done-{case}-{model}, fuzz-llm-{case}-{model},
          # check-gt-done-{case}, fuzz-gt-{case}

    # HTTP template for sub-second GCS completion checks (no container needed)
    # Uses GCS JSON API to check if _SUCCESS marker exists
    # Success (200) = file exists = skip task, Failure (404) = file missing = run task
    - name: check-completion
      inputs:
        parameters:
          - name: bucket
          - name: path # URL-encoded path to _SUCCESS marker
      http:
        url: "https://storage.googleapis.com/storage/v1/b/{{inputs.parameters.bucket}}/o/{{inputs.parameters.path}}"
        method: GET
        headers:
          - name: Authorization
            valueFrom:
              secretKeyRef:
                name: gcs-auth-token
                key: token
        successCondition: response.statusCode == 200
