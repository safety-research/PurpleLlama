# Upload original (pre-patch) binary for regression analysis.
#
# Runs a lightweight pod in the vul container image, finds the fuzzer binary,
# and uploads it to GCS. This makes the original binary available to all fuzz
# steps (both GT and LLM) for regression analysis.
#
# The binary is stored per-case (not per-agent) since it's the same vulnerable
# binary for all agents on a given case.

apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: arvo-upload-origbin
  namespace: argo
spec:
  templates:
    - name: upload-original-binary
      inputs:
        parameters:
          - name: case-id
          - name: experiment-id
          - name: bucket
          - name: registry
          - name: build-version
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "work"
          effect: "NoSchedule"
      nodeSelector:
        spot: "true"
        workload-type: work
      serviceAccountName: arvo-workflow-sa
      activeDeadlineSeconds: 600

      # Init container: runs in the vul image to find and copy the binary
      initContainers:
        - name: find-binary
          image: "{{inputs.parameters.registry}}/arvo-{{inputs.parameters.case-id}}-vul:{{inputs.parameters.build-version}}"
          command:
            - /bin/bash
            - -c
            - |
              set -e
              # Find the fuzzer binary (mirrors agent base.py _find_fuzzer_binary logic)
              BINARY=""

              # Priority 1: Parse /bin/arvo for the actual run command
              if [ -f /bin/arvo ]; then
                CANDIDATE=$(sed -n 's|.*exec[[:space:]]\+\(/[^ ]*\).*|\1|p' /bin/arvo | head -1)
                if [ -z "$CANDIDATE" ]; then
                  CANDIDATE=$(sed -n 's|.*/out/\([^ ]*\).*|/out/\1|p' /bin/arvo | head -1)
                fi
                if [ -n "$CANDIDATE" ] && [ -f "$CANDIDATE" ] && [ -x "$CANDIDATE" ]; then
                  BINARY="$CANDIDATE"
                fi
              fi

              # Priority 2: Find executable in /out/, prefer "fuzz" in name
              if [ -z "$BINARY" ]; then
                BINARY=$(find /out/ -maxdepth 1 -type f -executable \
                  ! -name "*.dict" ! -name "*.options" ! -name "*.zip" ! -name "*.txt" \
                  ! -name "llvm-*" ! -name "*.a" ! -name "*.o" \
                  -name "*fuzz*" 2>/dev/null | head -1)
              fi
              if [ -z "$BINARY" ]; then
                BINARY=$(find /out/ -maxdepth 1 -type f -executable \
                  ! -name "*.dict" ! -name "*.options" ! -name "*.zip" ! -name "*.txt" \
                  ! -name "llvm-*" ! -name "*.a" ! -name "*.o" \
                  2>/dev/null | head -1)
              fi

              if [ -z "$BINARY" ] || [ ! -f "$BINARY" ]; then
                echo "ERROR: Could not find fuzzer binary for case {{inputs.parameters.case-id}}"
                exit 1
              fi

              cp "$BINARY" /shared/original_binary
              chmod +x /shared/original_binary
              echo "Copied ${BINARY} to /shared/original_binary"
          volumeMounts:
            - name: shared
              mountPath: /shared

      # Main container: minimal image with gsutil for upload
      container:
        image: gcr.io/google.com/cloudsdktool/google-cloud-cli:alpine
        command:
          - /bin/sh
          - -c
          - |
            set -e
            CASE_ID="{{inputs.parameters.case-id}}"
            BUCKET="{{inputs.parameters.bucket}}"
            EXPERIMENT_ID="{{inputs.parameters.experiment-id}}"
            DEST="gs://${BUCKET}/results/${EXPERIMENT_ID}/${CASE_ID}/original_binary"

            if [ ! -f /shared/original_binary ]; then
              echo "ERROR: No binary found by init container"
              exit 1
            fi

            SIZE=$(stat -c%s /shared/original_binary 2>/dev/null || stat -f%z /shared/original_binary)
            echo "Binary: ${SIZE} bytes"

            # Upload once per case (same binary for all agents)
            if gsutil -q stat "$DEST" 2>/dev/null; then
              echo "Case ${CASE_ID}: already exists, skipping"
            else
              gsutil -q cp /shared/original_binary "$DEST"
              echo "Case ${CASE_ID}: uploaded"
            fi
        volumeMounts:
          - name: shared
            mountPath: /shared
            readOnly: true
        resources:
          requests:
            cpu: "500m"
            memory: "256Mi"
          limits:
            cpu: "1"
            memory: "512Mi"

      volumes:
        - name: shared
          emptyDir: {}
