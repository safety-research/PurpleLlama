# Backfill original (pre-patch) binary for regression analysis.
#
# For each case, runs a lightweight pod in the vul container image, finds the
# fuzzer binary, and uploads it to GCS for every agent-id that has results.
# This enables the fuzz step's regression analysis for experiments where the
# patch step didn't upload original_binary.
#
# Usage:
#   python -m cli submit-workflow backfill-original-binary.yaml \
#     --param experiment-id=fuzz1800_all \
#     --param cases-json='["781","783","1236",...]'
#
# Or via argo directly:
#   argo submit backfill-original-binary.yaml \
#     -p experiment-id=fuzz1800_all \
#     -p bucket=my-bucket \
#     -p registry=us-central1-docker.pkg.dev/project/repo \
#     -p cases-json='["781","783"]'

apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: backfill-origbin-
  namespace: argo
spec:
  entrypoint: backfill-pipeline
  serviceAccountName: arvo-workflow-sa
  parallelism: 50

  podMetadata:
    labels:
      owner: "{{workflow.labels.owner}}"
      experiment: "{{workflow.parameters.experiment-id}}"

  arguments:
    parameters:
      - name: experiment-id
      - name: bucket
        value: ""
      - name: registry
        value: ""
      - name: build-version
        value: "latest"
      - name: cases-json
        value: "[]"

  templates:
    - name: backfill-pipeline
      dag:
        failFast: false
        tasks:
          - name: backfill-cases
            withParam: "{{workflow.parameters.cases-json}}"
            template: backfill-case
            arguments:
              parameters:
                - name: case-id
                  value: "{{item}}"

    - name: backfill-case
      inputs:
        parameters:
          - name: case-id
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "work"
          effect: "NoSchedule"
      nodeSelector:
        spot: "true"
        workload-type: work
      serviceAccountName: arvo-workflow-sa
      activeDeadlineSeconds: 600

      # Init container: runs in the vul image to find and copy the binary
      initContainers:
        - name: find-binary
          image: "{{workflow.parameters.registry}}/arvo-{{inputs.parameters.case-id}}-vul:{{workflow.parameters.build-version}}"
          command:
            - /bin/bash
            - -c
            - |
              set -e
              # Find the fuzzer binary (mirrors agent base.py _find_fuzzer_binary logic)
              BINARY=""

              # Priority 1: Parse /bin/arvo for the actual run command
              if [ -f /bin/arvo ]; then
                CANDIDATE=$(sed -n 's|.*exec[[:space:]]\+\(/[^ ]*\).*|\1|p' /bin/arvo | head -1)
                if [ -z "$CANDIDATE" ]; then
                  CANDIDATE=$(sed -n 's|.*/out/\([^ ]*\).*|/out/\1|p' /bin/arvo | head -1)
                fi
                if [ -n "$CANDIDATE" ] && [ -f "$CANDIDATE" ] && [ -x "$CANDIDATE" ]; then
                  BINARY="$CANDIDATE"
                fi
              fi

              # Priority 2: Find executable in /out/, prefer "fuzz" in name
              if [ -z "$BINARY" ]; then
                BINARY=$(find /out/ -maxdepth 1 -type f -executable \
                  ! -name "*.dict" ! -name "*.options" ! -name "*.zip" ! -name "*.txt" \
                  ! -name "llvm-*" ! -name "*.a" ! -name "*.o" \
                  -name "*fuzz*" 2>/dev/null | head -1)
              fi
              if [ -z "$BINARY" ]; then
                BINARY=$(find /out/ -maxdepth 1 -type f -executable \
                  ! -name "*.dict" ! -name "*.options" ! -name "*.zip" ! -name "*.txt" \
                  ! -name "llvm-*" ! -name "*.a" ! -name "*.o" \
                  2>/dev/null | head -1)
              fi

              if [ -z "$BINARY" ] || [ ! -f "$BINARY" ]; then
                echo "ERROR: Could not find fuzzer binary for case {{inputs.parameters.case-id}}"
                exit 1
              fi

              cp "$BINARY" /shared/original_binary
              chmod +x /shared/original_binary
              echo "Copied ${BINARY} to /shared/original_binary"
          volumeMounts:
            - name: shared
              mountPath: /shared

      # Main container: cloud-sdk for gsutil operations
      container:
        image: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
        command:
          - /bin/bash
          - -c
          - |
            set -e
            CASE_ID="{{inputs.parameters.case-id}}"
            BUCKET="{{workflow.parameters.bucket}}"
            EXPERIMENT_ID="{{workflow.parameters.experiment-id}}"
            DEST="gs://${BUCKET}/results/${EXPERIMENT_ID}/${CASE_ID}/original_binary"

            if [ ! -f /shared/original_binary ]; then
              echo "ERROR: No binary found by init container"
              exit 1
            fi

            SIZE=$(stat -c%s /shared/original_binary 2>/dev/null || stat -f%z /shared/original_binary)
            echo "Binary: ${SIZE} bytes"

            # Upload once per case (same binary for all agents)
            if gsutil -q stat "$DEST" 2>/dev/null; then
              echo "Case ${CASE_ID}: already exists, skipping"
            else
              gsutil -q cp /shared/original_binary "$DEST"
              echo "Case ${CASE_ID}: uploaded"
            fi
        volumeMounts:
          - name: shared
            mountPath: /shared
            readOnly: true
        resources:
          requests:
            cpu: "500m"
            memory: "256Mi"
          limits:
            cpu: "1"
            memory: "512Mi"

      volumes:
        - name: shared
          emptyDir: {}
